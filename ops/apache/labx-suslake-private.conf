# Fragmento para inclusao DENTRO do VirtualHost *:8766 que publica /files/.
# Nao habilitar globalmente com a2enconf.
# Instalar de forma idempotente com:
#   sudo ops/apache/install-labx-private-guard.sh
#
# Assume Alias /files/ /dados/abertos/.
# Protege tanto por caminho fisico quanto por URL.

<Directory "/dados/abertos/suslake/raw">
    Require all denied
</Directory>

<Directory "/dados/abertos/suslake/state">
    Require all denied
</Directory>

<Directory "/dados/abertos/suslake/logs">
    Require all denied
</Directory>

<Directory "/dados/abertos/suslake/work">
    Require all denied
</Directory>

<Directory "/dados/abertos/suslake/bronze/cnes">
    Require all denied
</Directory>

<LocationMatch "^/files/suslake/(raw|state|logs|work)(/|$)">
    Require all denied
</LocationMatch>

<LocationMatch "^/files/suslake/bronze/cnes(/|$)">
    Require all denied
</LocationMatch>
