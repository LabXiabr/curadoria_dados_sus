# Instalar como /etc/apache2/conf-available/labx-suslake-private.conf
# e habilitar com:
#   sudo a2enconf labx-suslake-private
#   sudo apache2ctl configtest
#   sudo systemctl reload apache2
#
# Assume o endpoint /files/ -> /dados/abertos/.
# A protecao principal e por caminho fisico (Directory), para nao depender
# apenas do mapeamento URL/Alias. LocationMatch fica como defesa adicional.

<Directory "/dados/abertos/suslake/raw">
    Require all denied
</Directory>

<Directory "/dados/abertos/suslake/state">
    Require all denied
</Directory>

<Directory "/dados/abertos/suslake/logs">
    Require all denied
</Directory>

<Directory "/dados/abertos/suslake/work">
    Require all denied
</Directory>

<Directory "/dados/abertos/suslake/bronze/cnes">
    Require all denied
</Directory>

<LocationMatch "^/files/suslake/(raw|state|logs|work)(/|$)">
    Require all denied
</LocationMatch>

<LocationMatch "^/files/suslake/bronze/cnes(/|$)">
    Require all denied
</LocationMatch>
