# Lake SUS.
# Regra: privada por padrao; somente superficies explicitamente publicas
# recebem Require all granted.

<Directory "/dados/abertos/suslake">
    Require all denied
</Directory>

# CNES publicado por hardlink, sem expor Bronze/Silver canonicas inteiras.
<Directory "/dados/abertos/suslake/bronze/cnes_reference">
    Require all granted
    Options Indexes FollowSymLinks
</Directory>

<Directory "/dados/abertos/suslake/silver/cnes_reference">
    Require all granted
    Options Indexes FollowSymLinks
</Directory>

# Referencias atualmente publicadas.
<Directory "/dados/abertos/suslake/bronze/sigtap">
    Require all granted
    Options Indexes FollowSymLinks
</Directory>

<Directory "/dados/abertos/suslake/silver/sigtap">
    Require all granted
    Options Indexes FollowSymLinks
</Directory>

<Directory "/dados/abertos/suslake/bronze/reference">
    Require all granted
    Options Indexes FollowSymLinks
</Directory>

<Directory "/dados/abertos/suslake/silver/reference">
    Require all granted
    Options Indexes FollowSymLinks
</Directory>

# CNES canonico permanece privado.
# cnes_reference nao casa com estas expressoes.
<LocationMatch "^/files/suslake/bronze/cnes(/|$)">
    Require all denied
</LocationMatch>

<LocationMatch "^/files/suslake/silver/cnes(/|$)">
    Require all denied
</LocationMatch>

# Areas operacionais nunca sao publicas.
<LocationMatch "^/files/suslake/(state|staging|work)(/|$)">
    Require all denied
</LocationMatch>
