# Instalar como /etc/apache2/conf-available/labx-suslake-private.conf
# e habilitar com: sudo a2enconf labx-suslake-private && sudo systemctl reload apache2
#
# Assume o endpoint publico atual /files/ -> /dados/abertos/.
# Bloqueia artefatos internos e CNES Bronze completa, que pode conter
# identificadores de profissionais. Publicar CNES somente por datasets
# curados/explicitamente liberados.

<LocationMatch "^/files/suslake/(raw|state|logs|work)(/|$)">
    AuthType None
    Require all denied
</LocationMatch>

<LocationMatch "^/files/suslake/bronze/cnes(/|$)">
    AuthType None
    Require all denied
</LocationMatch>
