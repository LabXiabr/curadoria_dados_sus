# Fragmento para inclusao DENTRO do VirtualHost *:8766 que publica /files/.
# A lake canonica inteira fica privada. Somente hardlinks explicitamente
# projetados em /dados/abertos/{raw,bronze,silver} compoem a superficie publica.

<Directory "/dados/abertos/suslake">
    Require all denied
</Directory>

<LocationMatch "^/files/suslake(?:/|$)">
    Require all denied
</LocationMatch>
