# SUSLabX: default deny com allowlist explicita.
# Este fragmento e incluido dentro do VirtualHost :8766 que publica /files/.

<Directory "/dados/abertos/suslabx">
    Require all denied
</Directory>

# Raw oficial autorizado: projecao seletiva por hardlink dentro da propria camada.
<Directory "/dados/abertos/suslabx/raw/public">
    Require all granted
    Options Indexes FollowSymLinks
</Directory>

# CNES: canônico privado, superfície de referência explicitamente pública.
<Directory "/dados/abertos/suslabx/bronze/cnes_reference">
    Require all granted
    Options Indexes FollowSymLinks
</Directory>

<Directory "/dados/abertos/suslabx/silver/cnes_reference">
    Require all granted
    Options Indexes FollowSymLinks
</Directory>

# Referências/DATASUS homologadas.
<Directory "/dados/abertos/suslabx/bronze/sigtap">
    Require all granted
    Options Indexes FollowSymLinks
</Directory>

<Directory "/dados/abertos/suslabx/silver/sigtap">
    Require all granted
    Options Indexes FollowSymLinks
</Directory>

<Directory "/dados/abertos/suslabx/bronze/reference">
    Require all granted
    Options Indexes FollowSymLinks
</Directory>

<Directory "/dados/abertos/suslabx/silver/reference">
    Require all granted
    Options Indexes FollowSymLinks
</Directory>

# Nunca expor o CNES canônico completo.
<LocationMatch "^/files/suslabx/bronze/cnes(/|$)">
    Require all denied
</LocationMatch>

<LocationMatch "^/files/suslabx/silver/cnes(/|$)">
    Require all denied
</LocationMatch>

# Runtime nunca e parte da superficie publica.
<LocationMatch "^/files/suslabx/(state|staging|work|logs)(/|$)">
    Require all denied
</LocationMatch>
